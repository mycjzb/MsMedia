plugins {
    id 'com.android.library'
}

/* Media3 源码：与超级直播共用 bs-p2p/third_party/media3-src（同级仓库；MS_MEDIA3_SRC 可覆盖），
 * 并进本 SDK 模块编译，不再 api project(':media3-lib-*') */
def media3Src = file(System.getenv('MS_MEDIA3_SRC') ?: "${projectDir}/../../../bs-p2p/third_party/media3-src")
if (!new File(media3Src, 'libraries/exoplayer').isDirectory()) {
    throw new GradleException("缺共享 Media3 源码：${media3Src}（把 bs-p2p 拉到 MsMedia 同级，或设 MS_MEDIA3_SRC）")
}
def media3Libs = new File(media3Src, 'libraries')
def media3Modules = [
        'common', 'container', 'database', 'datasource', 'decoder',
        'extractor', 'exoplayer', 'exoplayer_hls', 'exoplayer_dash',
]

android {
    namespace 'com.mycjzb.media.player'
    compileSdk 34
    defaultConfig {
        minSdk 19
        targetSdk 34
        /* 客户 App 再开 R8 时的补充 keep；交付 AAR 本身已在本模块 release 裁过 */
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            /* 交付物：已 R8 裁过的 SDK（Media3 源码并进本模块，未引用类不进 AAR） */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'consumer-rules.pro'
        }
    }
    sourceSets {
        main {
            def dirs = ['src/main/java', '../hw/java']
            media3Modules.each { dirs += "${media3Libs}/${it}/src/main/java" }
            java.srcDirs = dirs
            java.exclude '**/MsHwPlayerActivity.java'
            java.exclude '**/MsHwSmokeActivity.java'
            /* 两处 jniLibs：
             *   ../msm3/app/src/main/jniLibs —— 每轮 build_msm3.sh 都会 rm -rf 重建，
             *     只放编出来的 libmsplayer.so；
             *   src/main/jniLibs —— 仓库内固定产物（libtvcore.so 等第三方 so），
             *     不会被 so 编译脚本清掉。 */
            jniLibs.srcDirs = ['src/main/jniLibs', '../msm3/app/src/main/jniLibs']
        }
    }
    packaging {
        jniLibs {
            keepDebugSymbols += ['**/libmsplayer.so']
        }
    }
}

dependencies {
    /* 原 media3 common/exoplayer 传递依赖，版本对齐共享 bs-p2p/third_party/media3-src/constants.gradle + media3-m2 */
    /* android 变体；Media3 公开 API 带 Guava 类型故 api。体积靠本模块 release R8，不靠客户裁功能 */
    api('com.google.guava:guava:33.0.0-android') {
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
    api 'androidx.annotation:annotation-experimental:1.3.1'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.collection:collection:1.1.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    /* 注解进编译期；运行时由 R8 按引用保留，勿整包打进 dex */
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:1.9.0'
    compileOnly 'com.google.j2objc:j2objc-annotations:1.3'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.18.0'
    compileOnly 'org.checkerframework:checker-qual:3.13.0'
}
